<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>จำนวน Hand — Dominate Ranking</title><link rel="stylesheet" href="/style.css"></head><body><div class="bg"></div><header><div class="brand"><div class="bolt">⚡</div><div><b>DOMINATE</b><span>RANKING</span></div></div><nav><a href="/announcement.html">ประกาศ</a><a href="/">Leaderboard</a><a class="active" href="/hands.html">จำนวน Hand</a></nav><a href="/admin.html" class="admin">ADMIN</a></header><main><section class="title"><div class="tag">HAND COUNT</div><h1>จำนวน<br><em>HAND</em></h1><p>สถิติ Hand ของผู้เล่นทั้งหมด</p></section><section class="board"><div class="board-head hands-head"><span>RANK</span><span>NAME</span><span>HANDS</span></div><div id="handRows"></div></section><div class="live">● LIVE&nbsp;&nbsp; อัปเดตอัตโนมัติ</div></main><script>const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function load(){const a=await fetch('/api/ranking',{cache:'no-store'}).then(r=>r.json());document.querySelector('#handRows').innerHTML=a.map((x,i)=>`<div class="row hands-row"><b>#${i+1}</b><span>${esc(x.name)}</span><strong>${Number(x.hands||0).toLocaleString()} <small>HAND</small></strong></div>`).join('')}load();setInterval(load,5000);</script></body></html>
