<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dominate Ranking — Admin</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand">
    <div class="bolt">⚡</div>
    <div><b>DOMINATE</b><span>RANKING</span></div>
  </div>
  <a href="/" class="admin">PUBLIC VIEW</a>
</header>

<main class="admin-main">
  <section id="loginPanel" class="panel">
    <div class="tag">CONTROL ROOM</div>
    <h2>ADMIN LOGIN</h2>
    <input id="usernameInput" value="admin" placeholder="Username" autocomplete="username">
    <input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password">
    <button id="loginButton">ENTER</button>
    <p id="loginError"></p>
    <small>!!เฉพาะ Admin เท่านั้น!!</small>
  </section>

  <section id="adminPanel" class="panel hidden">
    <div class="bar">
      <h2>MANAGE RANKING</h2>
      <button class="ghost" id="logoutButton">LOGOUT</button>
    </div>

    <form id="addForm" class="add">
      <input id="newName" placeholder="ชื่อ Player / Team" required>
      <input id="newValue" type="number" step="any" placeholder="คะแนน" required>
      <button type="submit">+ ADD</button>
    </form>

    <div id="list"></div>
  </section>
</main>

<script>
const loginPanel = document.querySelector("#loginPanel");
const adminPanel = document.querySelector("#adminPanel");
const usernameInput = document.querySelector("#usernameInput");
const passwordInput = document.querySelector("#passwordInput");
const loginButton = document.querySelector("#loginButton");
const loginError = document.querySelector("#loginError");
const logoutButton = document.querySelector("#logoutButton");
const addForm = document.querySelector("#addForm");
const newName = document.querySelector("#newName");
const newValue = document.querySelector("#newValue");
const list = document.querySelector("#list");

async function checkSession() {
  try {
    const response = await fetch("/api/me", { cache: "no-store" });
    const data = await response.json();

    loginPanel.classList.toggle("hidden", data.loggedIn);
    adminPanel.classList.toggle("hidden", !data.loggedIn);

    if (data.loggedIn) {
      await loadItems();
    }
  } catch (e) {
    loginError.textContent = "ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้";
  }
}

async function doLogin() {
  loginButton.disabled = true;
  loginError.textContent = "";

  try {
    const response = await fetch("/api/login", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        username: usernameInput.value.trim(),
        password: passwordInput.value
      })
    });

    const data = await response.json();

    if (!response.ok) {
      loginError.textContent = data.error || "เข้าสู่ระบบไม่สำเร็จ";
      return;
    }

    passwordInput.value = "";
    await checkSession();
  } catch (e) {
    loginError.textContent = "เกิดข้อผิดพลาดในการเชื่อมต่อ";
  } finally {
    loginButton.disabled = false;
  }
}

async function doLogout() {
  await fetch("/api/logout", { method: "POST" });
  await checkSession();
}

async function loadItems() {
  const response = await fetch("/api/ranking", { cache: "no-store" });
  const items = await response.json();

  list.innerHTML = items.map((item, index) => `
    <div class="edit">
      <b>#${index + 1}</b>
      <input id="name-${item.id}" value="${escapeAttr(item.name)}">
      <input id="value-${item.id}" type="number" step="any" value="${item.value}">
      <button type="button" onclick="saveItem(${item.id})">SAVE</button>
      <button type="button" class="del" onclick="deleteItem(${item.id})">DELETE</button>
    </div>
  `).join("");
}

async function saveItem(id) {
  const name = document.querySelector("#name-" + id).value.trim();
  const value = document.querySelector("#value-" + id).value;

  const response = await fetch("/api/items/" + id, {
    method: "PUT",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ name, value })
  });

  if (!response.ok) {
    const data = await response.json().catch(() => ({}));
    alert(data.error || "บันทึกไม่สำเร็จ");
    return;
  }

  await loadItems();
}

async function deleteItem(id) {
  if (!confirm("ยืนยันการลบรายการนี้?")) return;

  await fetch("/api/items/" + id, { method: "DELETE" });
  await loadItems();
}

async function addItem(event) {
  event.preventDefault();

  const response = await fetch("/api/items", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      name: newName.value.trim(),
      value: newValue.value
    })
  });

  if (!response.ok) {
    const data = await response.json().catch(() => ({}));
    alert(data.error || "เพิ่มรายการไม่สำเร็จ");
    return;
  }

  addForm.reset();
  await loadItems();
}

function escapeAttr(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

loginButton.addEventListener("click", doLogin);
passwordInput.addEventListener("keydown", event => {
  if (event.key === "Enter") doLogin();
});
logoutButton.addEventListener("click", doLogout);
addForm.addEventListener("submit", addItem);

checkSession();
</script>
</body>
</html>
