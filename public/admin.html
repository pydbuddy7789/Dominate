<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dominate Ranking — Admin</title><link rel="stylesheet" href="/style.css"></head>
<body><header><div class="brand"><div class="bolt">⚡</div><div><b>DOMINATE</b><span>RANKING</span></div></div><a href="/" class="admin">PUBLIC VIEW</a></header>
<main class="admin-main">
<section id="loginPanel" class="panel"><div class="tag">CONTROL ROOM</div><h2>ADMIN LOGIN</h2><input id="usernameInput" value="admin" placeholder="Username" autocomplete="username"><input id="passwordInput" type="password" placeholder="Password" autocomplete="current-password"><button id="loginButton">ENTER</button><p id="loginError"></p><small>!!เฉพาะ Admin เท่านั้น!!</small></section>
<section id="adminPanel" class="panel hidden"><div class="bar"><h2>MANAGE RANKING</h2><button class="ghost" id="logoutButton">LOGOUT</button></div>
<form id="addForm" class="add"><input id="newName" placeholder="ชื่อ Player / Team" required><input id="newValue" type="number" step="any" placeholder="คะแนน" required><input id="newHands" type="number" min="0" step="1" placeholder="จำนวน Hand" required><button type="submit">+ ADD</button></form>
<div id="list"></div></section></main>
<script>
const $=s=>document.querySelector(s); const loginPanel=$('#loginPanel'),adminPanel=$('#adminPanel'),loginError=$('#loginError');
async function checkSession(){try{const r=await fetch('/api/me',{cache:'no-store'}),d=await r.json();loginPanel.classList.toggle('hidden',d.loggedIn);adminPanel.classList.toggle('hidden',!d.loggedIn);if(d.loggedIn)await loadItems()}catch(e){loginError.textContent='ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์ได้'}}
async function doLogin(){const b=$('#loginButton');b.disabled=true;loginError.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:$('#usernameInput').value.trim(),password:$('#passwordInput').value})});const d=await r.json();if(!r.ok){loginError.textContent=d.error||'เข้าสู่ระบบไม่สำเร็จ';return}$('#passwordInput').value='';await checkSession()}catch(e){loginError.textContent='เกิดข้อผิดพลาดในการเชื่อมต่อ'}finally{b.disabled=false}}
async function doLogout(){await fetch('/api/logout',{method:'POST'});await checkSession()}
async function loadItems(){const r=await fetch('/api/ranking',{cache:'no-store'}),items=await r.json();$('#list').innerHTML=items.map((x,i)=>`<div class="edit"><b>#${i+1}</b><input id="name-${x.id}" value="${esc(x.name)}"><input id="value-${x.id}" type="number" step="any" value="${x.value}"><input id="hands-${x.id}" type="number" min="0" step="1" value="${Number(x.hands||0)}" placeholder="Hand"><button type="button" onclick="saveItem(${x.id})">SAVE</button><button type="button" class="del" onclick="deleteItem(${x.id})">DELETE</button></div>`).join('')}
async function saveItem(id){const name=$('#name-'+id).value.trim(),value=$('#value-'+id).value,hands=$('#hands-'+id).value;const r=await fetch('/api/items/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,value,hands})});const d=await r.json().catch(()=>({}));if(!r.ok){alert(d.error||'บันทึกไม่สำเร็จ');return}await loadItems()}
async function deleteItem(id){if(!confirm('ยืนยันการลบรายการนี้?'))return;await fetch('/api/items/'+id,{method:'DELETE'});await loadItems()}
async function addItem(e){e.preventDefault();const r=await fetch('/api/items',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:$('#newName').value.trim(),value:$('#newValue').value,hands:$('#newHands').value})});const d=await r.json().catch(()=>({}));if(!r.ok){alert(d.error||'เพิ่มรายการไม่สำเร็จ');return}$('#addForm').reset();await loadItems()}
function esc(v){return String(v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
$('#loginButton').addEventListener('click',doLogin);$('#passwordInput').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});$('#logoutButton').addEventListener('click',doLogout);$('#addForm').addEventListener('submit',addItem);checkSession();
</script></body></html>
