<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dominate Ranking — Admin</title><link rel="stylesheet" href="/style.css"></head><body>
<header><div class="brand"><div class="bolt">⚡</div><div><b>DOMINATE</b><span>RANKING</span></div></div><a href="/" class="admin">PUBLIC VIEW</a></header><main class="admin-main"><section id="login" class="panel"><div class="tag">CONTROL ROOM</div><h2>ADMIN LOGIN</h2><input id="user" value="admin" placeholder="Username"><input id="pass" type="password" placeholder="Password"><button onclick="login()">ENTER</button><p id="err"></p><small>เริ่มต้น: admin / admin1234</small></section>
<section id="app" class="panel hidden"><div class="bar"><h2>MANAGE RANKING</h2><button class="ghost" onclick="logout()">LOGOUT</button></div><form onsubmit="add(event)" class="add"><input id="n" placeholder="ชื่อ Player / Team" required><input id="v" type="number" step="any" placeholder="คะแนน" required><button>+ ADD</button></form><div id="list"></div></section></main>
<script>
async function check(){let x=await fetch("/api/me").then(r=>r.json());login.classList.toggle("hidden",x.loggedIn);app.classList.toggle("hidden",!x.loggedIn);if(x.loggedIn)load()}async function login(){let r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:user.value,password:pass.value})});if(!r.ok)return err.textContent=(await r.json()).error;check()}async function logout(){await fetch("/api/logout",{method:"POST"});check()}async function load(){let a=await fetch("/api/ranking").then(r=>r.json());list.innerHTML=a.map((x,i)=>`<div class="edit"><b>#${i+1}</b><input id="n${x.id}" value="${x.name.replaceAll('"','&quot;')}"><input id="v${x.id}" type="number" step="any" value="${x.value}"><button onclick="save(${x.id})">SAVE</button><button class="del" onclick="del(${x.id})">DELETE</button></div>`).join("")}async function save(id){await fetch("/api/items/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:document.querySelector("#n"+id).value,value:document.querySelector("#v"+id).value})});load()}async function del(id){if(confirm("ลบรายการนี้?")){await fetch("/api/items/"+id,{method:"DELETE"});load()}}async function add(e){e.preventDefault();await fetch("/api/items",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:n.value,value:v.value})});e.target.reset();load()}check();
</script></body></html>
