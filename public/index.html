<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dominate Ranking</title><link rel="stylesheet" href="/style.css"></head><body>
<div class="bg"></div><header><div class="brand"><div class="bolt">⚡</div><div><b>DOMINATE</b><span>RANKING</span></div></div><nav><a href="/announcement.html">ประกาศ</a><a class="active" href="/">Leaderboard</a><a href="/hands.html">จำนวน Hand</a></nav><a href="/admin.html" class="admin">ADMIN</a></header>
<main><section class="title"><div class="tag">LEADERBOARD</div><h1>DOMINATE<br><em>RANKING</em></h1><p>อันดับหนึ่งมีได้เพียงคนเดียวเท่านั้น</p></section>
<section class="podium" id="podium"></section><section class="board"><div class="board-head"><span>RANK</span><span>NAME</span><span>SCORE</span></div><div id="rows"></div></section><div class="live">● LIVE&nbsp;&nbsp; อัปเดตทุกวันหลังเวลา 21:00น.</div></main>
<script>
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function load(){let a=await fetch("/api/ranking").then(r=>r.json());document.querySelector("#podium").innerHTML=a.slice(0,3).map((x,i)=>`<div class="pod p${i+1}"><div class="medal">${i==0?'👑':i==1?'②':'③'}</div><div class="pname">${esc(x.name)}</div><strong>${Number(x.value).toLocaleString()}</strong><small>POINTS</small></div>`).join("");document.querySelector("#rows").innerHTML=a.slice(3).map((x,i)=>`<div class="row"><b>#${i+4}</b><span>${esc(x.name)}</span><strong>${Number(x.value).toLocaleString()}</strong></div>`).join("")}load();setInterval(load,5000);
</script></body></html>
